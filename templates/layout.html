<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pazudušās Mantas OVG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body>
    <nav class="main-nav">
        <div class="container nav-content">
            <a href="/" class="logo">
                <img src="{{url_for('static', filename='img/OVG.webp')}}" alt="OVG Logo">
                <span>Pazudušās Mantas OVG</span>
            </a>
            <div class="nav-links">
                <a href="/">Sākums</a>
                <a href="/arhivs">Arhīvs</a>
                <a href="/konts" class="btn-account">Konts/Pievienošana</a>
            </div>
        </div>
    </nav>

    <main class="container content-wrapper">
        {% block body %}{% endblock %}
    </main>

    <footer class="container text-center text-muted py-4">
        <small>Programmēšanas gala projekta darbs</small>
    </footer>
</body>
</html>

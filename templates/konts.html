{% extends "layout.html" %}

{% block body %}
<div class="form-container">
    <div class="header-section text-center">
        <h1>Pievienot jaunu mantu</h1>
        <p>Aizpildiet formu, lai reģistrētu atradumu</p>
    </div>

    {% if message %}
        <div class="alert alert-info">{{ message }}</div>
    {% endif %}

    <form action="/konts" method="post" enctype="multipart/form-data" class="styled-form">
        <div class="form-group">
            <label>Mantas nosaukums</label>
            <input name="nosaukums" type="text" placeholder="Piemēram: Melns lietussargs" required>
        </div>

        <div class="form-group">
            <label>Apraksts</label>
            <textarea name="apraksts" rows="3" placeholder="Aprakstiet detaļas..." required></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Kur atrasts?</label>
                <input name="kur_atrasts" type="text" placeholder="Telpa, stāvs..." required>
            </div>
            <div class="form-group">
                <label>Kad atrasts?</label>
                <input name="k_atrasts" type="text" placeholder="Datums vai laiks" required>
            </div>
        </div>

        <div class="form-group">
            <label class="file-label">
                <span>📷 Pievienot attēlu</span>
                <input type="file" name="manta" accept="image/png, image/jpeg">
            </label>
        </div>

        <button type="submit" class="btn-submit">Reģistrēt mantu</button>
    </form>
</div>
{% endblock %}
